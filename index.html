<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스포츠지도사 필기시험 D-Day</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🏋️ 스포츠지도사 필기시험</h1>
      <p class="subtitle">D-Day 카운트다운</p>
    </header>

    <section class="dday-section">
      <h2 id="dday-label">계산 중...</h2>
      <div class="timer">
        <div class="time-block">
          <span id="days" class="time-num">000</span>
          <span class="time-label">일</span>
        </div>
        <span class="colon">:</span>
        <div class="time-block">
          <span id="hours" class="time-num">00</span>
          <span class="time-label">시간</span>
        </div>
        <span class="colon">:</span>
        <div class="time-block">
          <span id="minutes" class="time-num">00</span>
          <span class="time-label">분</span>
        </div>
        <span class="colon">:</span>
        <div class="time-block">
          <span id="seconds" class="time-num">00</span>
          <span class="time-label">초</span>
        </div>
      </div>
    </section>

    <section class="info-section">
      <div class="info-row">
        <span class="info-key">예상 시험일</span>
        <span class="info-val">2027년 4월 17일 (토)</span>
      </div>
      <div class="info-row">
        <span class="info-key">오늘</span>
        <span id="today" class="info-val"></span>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
