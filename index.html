<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스포츠지도사 필기시험 D-Day</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="countdown-wrap">
    <p class="exam-label">스포츠지도사 필기시험까지</p>
    <h1 id="dday" class="dday">D-000</h1>

    <div class="timer">
      <div class="time-block">
        <span id="hours" class="time-num">00</span>
        <span class="time-label">시간</span>
      </div>
      <span class="colon">:</span>
      <div class="time-block">
        <span id="minutes" class="time-num">00</span>
        <span class="time-label">분</span>
      </div>
      <span class="colon">:</span>
      <div class="time-block">
        <span id="seconds" class="time-num">00</span>
        <span class="time-label">초</span>
      </div>
    </div>

    <p class="exam-date">시험일: 2027년 4월 17일 (토)</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
