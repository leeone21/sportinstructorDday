<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스포츠지도사 필기시험 D-Day</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <header>
      <p class="title">🏆 2027 생활·전문 스포츠지도사 필기시험</p>
      <p class="subtitle">D-Day 카운트다운</p>
    </header>

    <!-- 메인 카드: 타이머 + 배지 -->
    <div class="card main-card">
      <div class="timer">
        <div class="time-block">
          <span id="hours" class="time-num">00</span>
          <span class="time-label">시간</span>
        </div>
        <span class="colon">:</span>
        <div class="time-block">
          <span id="minutes" class="time-num">00</span>
          <span class="time-label">분</span>
        </div>
        <span class="colon">:</span>
        <div class="time-block">
          <span id="seconds" class="time-num">00</span>
          <span class="time-label">초</span>
        </div>
      </div>

      <div class="badge-wrap">
        <span id="dday-badge" class="badge">D-000</span>
        <p id="remaining-text" class="remaining">000일 00시간 00분 00초 남았습니다</p>
      </div>
    </div>

    <!-- 정보 카드 -->
    <div class="card info-card">
      <div class="info-row">
        <span class="info-label">시험일</span>
        <span class="info-val">2027년 4월 17일 (토)</span>
      </div>
      <div class="divider"></div>
      <div class="info-row">
        <span class="info-label">오늘</span>
        <span id="today" class="info-val"></span>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
